{% extends "base.html" %}
{% set title = "Search" %}
{% set description = "Search every post, framework and book by " ~ site.author ~ "." %}
{% block content %}
<section class="page-head">
  <div class="wrap">
    <h1>Search</h1>
    <p class="page-sub">Every post, framework and book in one place.</p>
    <form class="filter search-form" role="search" action="{{ base }}/search/">
      <label for="sq">Search for a word or idea</label>
      <input id="sq" name="q" type="search" placeholder="Try “data”, “questions” or “security”" autocomplete="off">
      <p class="filter-status" id="search-status" aria-live="polite"></p>
    </form>
  </div>
</section>
<section class="cards-section">
  <div class="wrap">
    <ol class="search-results" id="search-results"></ol>
    <noscript><p class="empty">Search needs JavaScript. You can browse <a href="{{ base }}/posts/">writing</a>, <a href="{{ base }}/frameworks/">frameworks</a> and <a href="{{ base }}/books/">books</a> instead.</p></noscript>
  </div>
</section>
<script>window.SEARCH_INDEX = "{{ base }}/search.json";</script>
<script src="{{ base }}/assets/js/search.js" defer></script>
{% endblock %}
