# Rebuilds and publishes the site every time something is changed on the
# main branch. You don't need to touch this file.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every morning (about 5am Central in winter, 6am in summer) so scheduled posts and books appear before 7am
  schedule:
    - cron: "7 11 * * *"
  # Rebuild every evening (about 9pm Central in winter, 10pm in summer) for items with a publish_at time
    - cron: "1 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
